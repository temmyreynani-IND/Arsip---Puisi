
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Arsip puisi dan karya sastra.">
  <title>Arsip Puisi</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --panel: #1b1b1b;
      --text: #e8e4dc;
      --muted: #a5a097;
      --accent: #c5a880;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.8;
    }

    header, main, footer {
      width: min(100% - 36px, 720px);
      margin-inline: auto;
    }

    header {
      padding: 48px 0 28px;
      border-bottom: 1px solid #343434;
    }

    .label {
      color: var(--accent);
      font: 12px Arial, sans-serif;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(32px, 8vw, 52px);
      font-weight: normal;
      line-height: 1.2;
      margin: 18px 0 8px;
    }

    .intro, .date, footer {
      color: var(--muted);
    }

    main {
      padding: 32px 0;
    }

    .poem {
      background: var(--panel);
      padding: 24px;
      border: 1px solid #303030;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .poem h2 {
      font-size: 24px;
      font-weight: normal;
      margin: 0 0 4px;
    }

    .date {
      font: 12px Arial, sans-serif;
      margin-bottom: 20px;
    }

    .verses {
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--accent);
    }

    footer {
      border-top: 1px solid #343434;
      padding: 24px 0 40px;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      header { padding-top: 32px; }
      .poem { padding: 18px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="label">Arsip Sastra</div>
    <h1>Ruang Kata</h1>
    <p class="intro">
      Sebuah tempat bagi kata-kata untuk tinggal.
    </p>
  </header>

  <main>
    <p class="label">Koleksi Puisi</p>

    <article class="poem">
      <h2>Puisi Pertama</h2>
      <div class="date">Karya perdana</div>
      <div class="verses">Tuliskan puisimu di sini.
Ganti baris ini dengan bait berikutnya.

Setiap baris akan tetap terpisah.</div>
    </article>
  </main>

  <footer>
    <p>© 2026 · Arsip Puisi</p>
    <p>
      Instagram:
      <a href="https://www.instagram.com/"
         target="_blank" rel="noopener noreferrer">
        Kunjungi profil
      </a>
    </p>
  </footer>
</body>
</html>
